<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../assets/css/stylesheet.css">
    </head>

    <body>
        <header>
            <h1>Add books</h1>
            <input type="checkbox" id="nav-toggle" class="nav-toggle">
            <label for="nav-toggle" class="nav-toggle-label" >&#9776;</label>
 <nav>
                    <ul>
                        <li><a href="../index.html">Home</a></li>
                        <li><a href="../jobsheet3/books/addBook.html">Add Book</a></li>
                        <li><a href="../jobsheet3/books/list.html">Books List</a></li>
                        <li><a href="../jobsheet3/members/addMember.html"> Add Members</a></li>
                        <li><a href="../jobsheet3/members/list.html">List Members</a></li>
                    </ul>
                </nav>
        </header>

        <main>
            <section>
                <form action="">

                    <p>
                        <label for="title">Title</label>
                        <input type="text" name="title" id="title">
                    </p>
                    <p>
                        <label for="author">Author</label>
                        <input type="text" name="author" id="author">
                    </p>
                    <p>
                        <label for="year">Year</label>
                        <input type="text" name="year" id="year" min="1900" max="2026" required>

                    </p>

                    <p>
                        <label for="isbn">ISBN</label>
                        <input type="text" name="isbn" id="isbn">
                    </p>
                    <p>
                        <label for="stock">Stock</label>
                        <input type="number" name="stock" id="stock" min="0" required>
                    </p>

                    <p>
                        <label for="category">Cotegory</label>
                        <select name="category" id="category">
                            <option value="fiction">Fiction</option>
                            <option value="non-fiction">Non-Fiction</option>
                            <option value="reference">Reference</option>
                        </select>
                    </p>

                    <p>
                        <button type="submit">Save</button>
                    </p>

                </form>

        </section>
    </main>
    </body>

</html>
